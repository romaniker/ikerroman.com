<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Iker Roman</title>
    <meta name="description" content="Blog de Iker Roman — tecnología, negocios y vida real.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000000;
            --text: #FFFFFF;
            --text-secondary: #888888;
            --border: #222222;
            --input-bg: #111111;
        }

        [data-theme="light"] {
            --bg: #FFFFFF;
            --text: #000000;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --input-bg: #f5f5f5;
        }

        body {
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .nav-left a {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-right a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-right a:hover { color: var(--text); }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 1rem;
            line-height: 1;
            transition: border-color 0.2s;
        }

        .theme-toggle:hover { border-color: var(--text-secondary); }

        /* CONTENT */
        .container {
            max-width: 620px;
            margin: 0 auto;
            padding: 6rem 1.5rem 4rem;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .post-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .post-item a {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            text-decoration: none;
            color: var(--text);
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s;
            gap: 1rem;
        }

        .post-item a:hover { border-color: var(--text-secondary); }

        .post-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-secondary);
            max-width: 620px;
            margin: 2rem auto 0;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover { color: var(--text); }

        @media (max-width: 480px) {
            .page-title { font-size: 1.5rem; }
            nav { padding: 0.85rem 1rem; }
            .nav-right { gap: 1rem; }
            .post-item a { flex-direction: column; gap: 0.25rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="/">iker roman</a>
        </div>
        <div class="nav-right">
            <a href="/blog.html">blog</a>
            <a href="https://x.com/TU_USUARIO" target="_blank" rel="noopener">twitter</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">☀️</button>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Blog</h1>
        <p class="page-subtitle">Lo que voy construyendo, aprendiendo y pensando.</p>

        <ul class="post-list">
            <!-- POSTS: Añade nuevos posts aquí arriba (el más reciente primero) -->
            <li class="post-item">
                <a href="/blog/hola-mundo.html">
                    <span class="post-title">Hola mundo</span>
                    <span class="post-date">12 abr 2026</span>
                </a>
            </li>
            <!-- /POSTS -->
        </ul>
    </div>

    <footer>
        <p>© 2026 Iker Roman · <a href="/">Inicio</a></p>
    </footer>

    <script>
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        function setTheme(t) {
            html.setAttribute('data-theme', t);
            toggle.textContent = t === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', t);
        }
        setTheme(localStorage.getItem('theme') || 'dark');
        toggle.addEventListener('click', () => {
            setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
